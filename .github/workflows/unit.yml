name: unit

# test.yml 已在 PR 中覆盖 Python 3.12 pytest；这里只保留手动聚焦复跑。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q
