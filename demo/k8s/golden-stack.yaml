apiVersion: v1
kind: Namespace
metadata:
  name: golden-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-app
  namespace: golden-demo
data:
  server.py: |
    import math, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from threading import Lock
    active = 0
    total = 0
    last_latency = 0.0
    lock = Lock()
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            global active, total, last_latency
            if self.path == '/metrics':
                body = (f'checkout_active_requests {active}\n' f'checkout_requests_total {total}\n' f'checkout_request_latency_seconds {last_latency}\n').encode()
                self.send_response(200)
                self.send_header('Content-Type', 'text/plain; version=0.0.4; charset=utf-8')
                self.send_header('Content-Length', str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return
            if self.path == '/healthz':
                self.send_response(200); self.end_headers(); self.wfile.write(b'ok'); return
            if self.path != '/work':
                self.send_response(404); self.end_headers(); return
            started = time.perf_counter()
            with lock: active += 1; total += 1; now = active
            deadline = time.perf_counter() + 0.09 + min(now, 12) * 0.012
            x = 0.1
            while time.perf_counter() < deadline:
                x = math.sin(x) * math.cos(x) + 0.12345
            last_latency = time.perf_counter() - started
            with lock: active -= 1
            self.send_response(200); self.end_headers(); self.wfile.write(b'checkout-ok')
        def log_message(self, *_): return
    ThreadingHTTPServer(('0.0.0.0', 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: golden-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      containers:
      - name: checkout
        image: python:3.12-slim
        command: ["python", "/app/server.py"]
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 100m
            memory: 32Mi
          limits:
            cpu: "1"
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 2
        volumeMounts:
        - name: app
          mountPath: /app
      volumes:
      - name: app
        configMap:
          name: checkout-app
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: golden-demo
spec:
  selector:
    app: checkout-api
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: golden-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
    scrape_configs:
    - job_name: checkout-api
      static_configs:
      - targets: ['checkout-api.golden-demo.svc.cluster.local:8080']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: golden-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0
        args: ["--config.file=/etc/prometheus/prometheus.yml"]
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: golden-demo
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: golden-demo
spec:
  replicas: 0
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
      - name: load
        image: curlimages/curl:8.16.0
        command: ["sh", "-c"]
        args:
        - |
          while true; do
            for i in $(seq 1 10); do
              curl -fsS http://checkout-api:8080/work >/dev/null &
            done
            wait
          done
