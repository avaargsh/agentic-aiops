[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-aiops"
version = "0.1.0"
description = "Evidence-first Agentic AIOps reference implementation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
temporal = ["cloud-agent-runtime[temporal]>=0.1.0"]

[project.scripts]
agentic-aiops = "agentic_aiops.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_aiops"]
